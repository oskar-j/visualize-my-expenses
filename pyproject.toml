[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vme-py"
# The one place the version lives: bump it here (`uv version --bump patch`) and
# a merge to master publishes it. `vme.__version__` reads it back at runtime.
version = "0.1.1"
description = "Turn a list of budget expenses into a Sankey diagram you can share as a PNG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Oskar Jarczyk" }]
keywords = ["sankey", "budget", "expenses", "personal-finance", "visualization", "plot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "click>=8.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
html = ["plotly>=5.0"]
all = ["openpyxl>=3.0", "plotly>=5.0"]

[project.scripts]
vme = "vme.cli:main"

[project.urls]
Homepage = "https://github.com/oskar-j/visualize-my-expenses"
Source = "https://github.com/oskar-j/visualize-my-expenses"
Issues = "https://github.com/oskar-j/visualize-my-expenses/issues"
Changelog = "https://github.com/oskar-j/visualize-my-expenses/blob/master/CHANGELOG.md"

[dependency-groups]
# `uv sync` installs these; they include both optional extras so the whole test
# suite runs rather than skipping the Excel and HTML cases.
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "openpyxl>=3.0",
    "plotly>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vme"]

[tool.hatch.build.targets.sdist]
include = ["src/vme", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]
# The README links the rendered PNGs on GitHub, so the sdist need not carry them.
exclude = ["examples/output"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# The package supports Python 3.9, so typing.Optional / Dict / List stay as they
# are; C408's dict(...) calls are the idiomatic form for click settings.
ignore = ["UP006", "UP007", "UP035", "UP045", "C408"]
